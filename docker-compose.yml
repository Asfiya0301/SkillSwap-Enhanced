services:
  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    ports:
      - "${SERVER_PORT:-5001}:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillswap
      JWT_SECRET: ${JWT_SECRET:-skillswap_dev_secret_change_me}
      CLIENT_URL: http://localhost:${CLIENT_PORT:-5174}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${CLIENT_PORT:-5174}:5173"
    environment:
      VITE_API_URL: http://localhost:${SERVER_PORT:-5001}/api
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
